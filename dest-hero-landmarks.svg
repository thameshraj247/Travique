    <!-- Middle tier -->
    <path d="M 78,174 L 84,115 L 101,115 L 107,174 Z" />
    <!-- Platform 2 -->
    <rect x="82" y="110" width="21" height="6" rx="1" />
    <!-- Spire -->
    <path d="M 87,110 L 91,25 L 94,25 L 98,110 Z" />
    <!-- Tip & Antenna -->
    <line x1="92.5" y1="25" x2="92.5" y2="2" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" />
